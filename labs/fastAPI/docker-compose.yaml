services:
  postgres:
    image: postgres:16.9
    environment:
      - POSTGRES_DB=${DB_NAME:-mydatabase}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
      - POSTGRES_USER=${DB_USERNAME:-myuser}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: api-fast-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      - postgres

volumes:
  postgres_data:
